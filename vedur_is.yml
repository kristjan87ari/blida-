name: Sækja spá Veðurstofunnar
on:
  schedule:
    - cron: "15 * * * *"   # á klukkutíma fresti
  workflow_dispatch:        # og handvirkt úr Actions-flipanum
permissions:
  contents: write
jobs:
  saekja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python saekja_vedur_is.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add vedur_is.json
          git diff --cached --quiet || git commit -m "Uppfæra spá Veðurstofunnar"
          git push
