name: Sækja spá og viðvaranir Veðurstofunnar
on:
  schedule:
    - cron: "15 */2 * * *"   # á tveggja tíma fresti (Cloudflare Pages leyfir 500 uppfærslur á mánuði)
  workflow_dispatch:        # og handvirkt úr Actions-flipanum
permissions:
  contents: write
jobs:
  saekja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python saekja_vedur_is.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.json
          git diff --cached --quiet || git commit -m "Uppfæra spá og viðvaranir Veðurstofunnar"
          git push
