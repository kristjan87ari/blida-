<style>
:root{--bg:#e4eaeb;--panel:#f6f8f8;--haf:#d2dfe2;--land:#fbfcfb;--strond:#7a8d91;--net:#bfced2;--hiti:#3f7a4a;--text:#1f2a2e;--muted:#56656a;--line:#cbd5d4;--fokus:#2f6690;--rautt:#d72828;--chip:#eef2f2;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13181a;--panel:#1b2225;--haf:#162024;--land:#2b3539;--strond:#62757a;--net:#23313a;--hiti:#7fc28a;--text:#e4eaeb;--muted:#9aa9ac;--line:#2b3639;--fokus:#7fb3d9;--rautt:#ff4d4d;--chip:#232c30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13181a;--panel:#1b2225;--haf:#162024;--land:#2b3539;--strond:#62757a;--net:#23313a;--hiti:#7fc28a;--text:#e4eaeb;--muted:#9aa9ac;--line:#2b3639;--fokus:#7fb3d9;--rautt:#ff4d4d;--chip:#232c30;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,390px);grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;padding:14px 20px 12px;border-bottom:1px solid var(--line);background:var(--bg);display:grid;gap:10px}
.topp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
h1 a{color:inherit;text-decoration:none}
.valmynd{display:flex;gap:4px 16px;flex-wrap:wrap;margin-right:auto;font-size:14px}
.valmynd a{color:var(--muted);text-decoration:none;padding:2px 0;border-bottom:2px solid transparent}
.valmynd a:hover{color:var(--text)}
.valmynd a[aria-current="page"]{color:var(--text);border-bottom-color:var(--text)}
.gestir{font-size:12px;color:var(--muted);opacity:.7;font-variant-numeric:tabular-nums}
.mal select{font:inherit;font-size:13px;color:var(--text);background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:4px 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kortahluti{display:grid;gap:10px;min-width:0}
.kortahluti>*,header>*{min-width:0}
header{min-width:0}
.nedri{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.nedri .rod{flex:1 1 auto;min-width:0}
.saekja-hopur{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-left:auto}
#sida{grid-column:1/-1;grid-row:2;overflow:auto;padding:28px 22px 48px;background:var(--panel);outline:none}
#sida article,#sida .tilbaka{max-width:68ch;margin:0 auto}
#sida h2{font-size:28px;line-height:1.2;margin:0 0 14px;letter-spacing:-.01em}
#sida h3{font-size:18px;margin:28px 0 8px}
#sida p,#sida li{line-height:1.6}
#sida ul{padding-left:20px}
#sida li{display:list-item;border:0;padding:0;cursor:auto;margin:6px 0}
#sida a{color:var(--fokus)}
.vidvorun{border-left:4px solid var(--rautt);background:var(--chip);padding:12px 16px;border-radius:0 8px 8px 0;margin:18px 0}
.einkunnir{border-collapse:collapse;margin:12px 0}
.einkunnir th{text-align:left;padding:6px 18px 6px 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.einkunnir td{padding:6px 0;color:var(--muted)}
.einkunnir tr+tr{border-top:1px solid var(--line)}
.fyrirvari{font-size:12px;color:var(--muted);margin-top:16px}
.fyrirvari a{color:var(--fokus)}
body.a-sidu #kort,body.a-sidu aside,body.a-sidu #tilkynning,body.a-sidu .kortahluti{display:none!important}
.timi{color:var(--muted);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--fokus);outline-offset:2px}
#saekja{background:var(--text);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;gap:8px;align-items:center}
#saekja[disabled]{opacity:.6;cursor:progress}
#saekja .snua{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:none}
#saekja[disabled] .snua{display:inline-block;animation:snua .8s linear infinite}
@keyframes snua{to{transform:rotate(360deg)}}
.rod{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.flokkur,.dagur{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 13px;white-space:nowrap;font-size:14px}
.flokkur[aria-pressed="true"],.dagur[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.dagur{padding:4px 11px;font-size:13px}
.lysing{font-size:14px;color:var(--muted);margin:0}
#kort{grid-column:1;grid-row:2;position:relative;background:var(--haf);overflow:hidden;min-height:320px}
.leaflet-container{background:var(--haf);font:inherit}
#kort.an-flisa .leaflet-tile-pane{display:none}
.varaland{fill:var(--land);fill-opacity:1;stroke:var(--strond);stroke-width:1}
.reitur{fill:var(--hiti)}
#kort.haetta .reitur{fill:#e8590c}
.vidv{stroke-width:2;stroke-dasharray:5 4;fill-opacity:.25}
.vidv-gul{fill:#f5c400;stroke:#b38b00}.vidv-appelsinugul{fill:#f08c00;stroke:#b35900}.vidv-raud{fill:#e03131;stroke:#a51111}
.vidv-litur{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-1px;flex:none}
.vl-gul{background:#f5c400}.vl-appelsinugul{background:#f08c00}.vl-raud{background:#e03131}
.vidv-kassi{border:1px solid var(--line);border-left:4px solid #f08c00;border-radius:8px;padding:10px 12px;margin:14px 0 6px;font-size:14px}
.vidv-kassi ul{list-style:none;margin:6px 0 4px;padding:0}
.vidv-kassi li{display:block;border:0;padding:0;cursor:auto}
.vidv-kassi button{display:flex;gap:2px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:6px 0;font-size:14px}
.vidv-kassi button:hover .vidv-heiti{text-decoration:underline}
.vidv-kassi .vidv-litur{margin-top:4px}
.vidv-kassi .smatt,.vidv-ovirkt{color:var(--muted);font-size:12px;margin:4px 0}
.vidv-ovirkt{margin:12px 0 4px}
.vidv-ovirkt a,.vidv-kassi a{color:var(--fokus)}
.vidv-merki{font-weight:500}
.gi{white-space:nowrap;margin-right:6px;display:inline-block}
.gi>span[aria-hidden]{margin-right:3px}
.vt-lita{font-size:16px;margin-right:2px}
.vt-lina{display:flex;align-items:center;gap:8px;font-weight:500;margin:4px 0}
.vt-stort{font-size:26px;line-height:1}
.gildi-lina{font-size:13px;line-height:1.7}
.leaflet-popup-content a.leid-hnappur{display:block;text-align:center;margin:8px 0 6px;background:var(--fokus);color:#fff;border-radius:7px;padding:7px 10px;font-weight:500;text-decoration:none}
.leaflet-popup-content a.leid-hnappur:hover{filter:brightness(1.1)}
.halendi{font-size:12px;color:var(--text);background:var(--chip);border-left:3px solid #f08c00;padding:5px 8px;border-radius:0 6px 6px 0}
.heimildakassi{border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin:14px 0 0;background:var(--bg)}
.heimildakassi summary{font-weight:500;color:var(--text);cursor:pointer}
.heimildakassi dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px}
.heimildakassi dt{font-weight:500;color:var(--text);white-space:nowrap}
.heimildakassi dd{margin:0;color:var(--muted)}
.heimildakassi a{color:var(--fokus)}
@media (max-width:420px){.heimildakassi dl{grid-template-columns:1fr}.heimildakassi dd{margin-bottom:4px}}
.klaedi{margin:14px 0 0}
.kl-opna{width:100%;text-align:left;background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-weight:500;font-size:15px}
.kl-opna[aria-expanded="true"]{border-radius:9px 9px 0 0}
#kl-efni{border:1px solid var(--line);border-top:0;border-radius:0 0 9px 9px;padding:10px 12px}
.kl-stadur{display:flex;flex-wrap:wrap;gap:6px}
.kl-stadur button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 9px;font-size:13px}
.kl-stadur input{flex:1 1 150px;min-width:0;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text)}
#kl-nidurstada h3{font-size:15px;margin:12px 0 0}
#kl-nidurstada h4{font-size:13px;font-weight:500;color:var(--muted);margin:10px 0 2px}
#kl-nidurstada ul{list-style:none;margin:0;padding:0}
#kl-nidurstada li{display:flex;gap:8px;border:0;padding:3px 0;cursor:auto;font-size:14px;align-items:flex-start}
#kl-nidurstada li>span:first-child{width:20px;flex:none;text-align:center}
.kl-vita li{color:var(--muted)}
.kl-adst{font-size:13px;margin:4px 0;font-variant-numeric:tabular-nums}
.kl-smatt{font-size:12px;color:var(--muted);margin:6px 0}

um:`<h2>Um síðuna</h2>
<p>Besti staðurinn er tilraunaverkefni sem bendir á hvar á Íslandi veðrið gæti hentað best fyrir það sem þú ætlar að gera. Síðan er hugmyndabanki, ekki veðurspá og ekki öryggisráðgjöf.</p>
<div class="vidvorun"><strong>Ekki treysta blint á það sem hér sést.</strong> Veðurlíkön skeika, sérstaklega í fjalllendi og þegar spáð er nokkra daga fram í tímann. Skoðaðu alltaf vedur.is, snjóflóðaspá Veðurstofunnar og safetravel.is áður en þú leggur af stað, og treystu eigin mati á staðnum.</div>
<h3>Hvaðan koma gögnin</h3>
<ul><li><strong>Veðurlíkön:</strong> ECMWF (Evrópska reiknimiðstöðin), HARMONIE-AROME (DMI) og ICON (Þýska veðurstofan), og eftir vali GFS, UKMO og Météo-France. Gögnin eru sótt í gegnum Open-Meteo (open-meteo.com), sem dreifir opnum gögnum veðurstofanna með leyfinu CC BY 4.0.</li>
<li><strong>Veðurstofa Íslands:</strong> stöðvaspár af vedur.is, þegar þær eru tiltækar.</li>
<li><strong>Kort:</strong> OpenTopoMap (CC-BY-SA), byggt á OpenStreetMap og SRTM-hæðargögnum, og loftmyndir frá Esri. Strandlína frá Natural Earth.</li></ul>
<h3>Hvernig þetta virkar</h3>
<p>Landinu er skipt í um 150 reiti, um 28 × 23 km hvern. Fyrir hvern reit sækir síðan spá úr nokkrum veðurlíkönum, reiknar einkunn fyrir hvert líkan og tekur meðaltalið. Rauðu punktarnir eru bestu reitirnir, með minnst 30 km á milli. Nánar er fjallað um einkunnirnar undir „Hvernig virkar þetta“.</p>
<p>Allir útreikningar fara fram í vafranum þínum. Síðan safnar engum persónuupplýsingum og notar engar vafrakökur; hún man aðeins stillingar þínar í vafranum sjálfum. Gestateljarinn telur opnar tengingar, ekki hverjir eru inni.</p>
<h3>Fyrirvari og ábyrgð</h3>
<p>Upplýsingarnar á síðunni eru eingöngu leiðbeinandi og settar fram án nokkurrar ábyrgðar á réttmæti þeirra, nákvæmni eða því að þær séu uppfærðar. Þær koma ekki í stað opinberra veðurspáa, viðvarana eða ráðgjafar fagfólks.</p>
<p>Notkun síðunnar er alfarið á eigin ábyrgð. Aðstandendur síðunnar bera, að því marki sem lög leyfa, enga ábyrgð á tjóni, slysum, kostnaði eða óþægindum sem rekja má til notkunar upplýsinganna, villna í gögnum frá þriðju aðilum eða þess að síðan sé ekki aðgengileg. Ákvarðanir um ferðir, útivist og veiði eru alltaf á ábyrgð þess sem tekur þær.</p>
<p>Ef þýðing og íslenskur texti greinir á gildir íslenski textinn.</p>`,

<p>Hér er útskýrt hvernig einkunnirnar verða til og hvernig best er að lesa þær.</p>
<h3>Einkunnin 0–100</h3>
<p>Hver flokkur metur þá veðurþætti sem skipta máli fyrir viðkomandi afþreyingu, á þeim tíma dags sem hún fer fram. Fyrir útilegu skiptir hitinn um nóttina máli, fyrir fjallgöngu vindhviður og ský á tindum, fyrir norðurljós skýjahula og myrkur. Hver þáttur fær gildi frá 0 til 1 eftir því hversu nálægt kjöraðstæðum hann er, og þættirnir eru vegnir saman í einkunn. Hæð yfir sjó getur lækkað einkunnina, til dæmis fyrir útilegu á hálendinu.</p>
<table class="einkunnir"><tr><th>80–100</th><td>Frábærar aðstæður</td></tr><tr><th>60–79</th><td>Góðar aðstæður</td></tr><tr><th>40–59</th><td>Sæmilegar; gætu gengið</td></tr><tr><th>20–39</th><td>Síðri aðstæður</td></tr><tr><th>0–19</th><td>Óhentugt; ekki sýnt sem punktur</td></tr></table>
<h3>Hvað er marktækt</h3>
<ul><li><strong>Litlir munir:</strong> 5 stiga munur eða minni milli staða er innan skekkjumarka. Líttu á slíka staði sem jafngóða.</li>
<li><strong>Tími:</strong> spáin er marktækari fyrir næstu 1–2 daga en 4–5 daga fram í tímann.</li>
<li><strong>Óvissa:</strong> ef líkönin eru ósammála kemur það fram við staðinn. „Líkönin eru sammála“ þýðir innan við 6 stiga mun milli líkana, „nokkur óvissa“ 6–12 stig og „mikil óvissa“ meira en 12 stig. Taktu einkunn með mikilli óvissu með fyrirvara.</li>
<li><strong>Stærð reita:</strong> hver punktur stendur fyrir allan reitinn sinn. Dalir, skjól og tindar innan reitsins geta verið mjög ólík.</li></ul>
<h3>Hættuvísir snjóflóða</h3>
<p>Snjóflóðaflokkurinn er öðruvísi: þar er há tala slæm. Hann metur nýsnjó síðustu þriggja sólarhringa, skafrenning og hlýnun eða regn á snjó, en hvorki landslag, halla né snjóalög. Lágur hættuvísir þýðir aldrei að svæði sé öruggt.</p>
<h3>Litir og merkingar</h3>
<ul><li><strong>Rauðir punktar:</strong> bestu staðirnir, númeraðir eftir einkunn.</li>
<li><strong>Grænir reitir:</strong> einkunn alls landsins; dekkri er betri. Í snjóflóðaflokknum eru reitirnir appelsínugulir og dekkri er verri.</li>
<li><strong>„Óbreytt“:</strong> punkturinn hélt sæti sínu frá síðustu uppfærslu. Punktur færist aðeins ef nýr staður er marktækt betri, meira en 4 stigum.</li>
<li><strong>Stjarna:</strong> besti bletturinn innan reits, fundinn með nákvæmari leit með um 4 km upplausn.</li></ul>`}},

sidur:{
um:`<h2>About</h2>
<p>Besti staðurinn (“The best place”) is an experimental project that suggests where in Iceland the weather may best suit what you plan to do. It is a source of ideas, not a weather forecast and not safety advice.</p>
<div class="vidvorun"><strong>Do not rely blindly on what you see here.</strong> Weather models make mistakes, especially in mountains and several days ahead. Always check vedur.is, the Icelandic Met Office avalanche forecast and safetravel.is before you set off, and trust your own judgement on site.</div>
<h3>Where the data comes from</h3>
<ul><li><strong>Weather models:</strong> ECMWF, HARMONIE-AROME (DMI) and ICON (German Weather Service), and optionally GFS, UKMO and Météo-France. The data is retrieved via Open-Meteo (open-meteo.com), which distributes the weather services’ open data under the CC BY 4.0 licence.</li>
<li><strong>Icelandic Met Office:</strong> station forecasts from vedur.is, when available.</li>
<li><strong>Maps:</strong> OpenTopoMap (CC-BY-SA), based on OpenStreetMap and SRTM elevation data, and satellite imagery from Esri. Coastline from Natural Earth.</li></ul>
<h3>How it works</h3>
<p>The country is divided into about 150 cells of roughly 28 × 23 km. For each cell the page fetches forecasts from several weather models, calculates a score for each model and takes the average. The red points are the best cells, at least 30 km apart. The scores are explained under “How it works”.</p>
<p>All calculations run in your browser. The site collects no personal data and uses no cookies; it only remembers your settings in your own browser. The visitor counter counts open connections, not who is visiting.</p>
<h3>Disclaimer and liability</h3>
<p>The information on this site is purely indicative and is provided without any warranty as to its correctness, accuracy or timeliness. It does not replace official weather forecasts, warnings or professional advice.</p>
<p>You use the site entirely at your own risk. To the extent permitted by law, the people behind the site accept no liability for damage, accidents, costs or inconvenience arising from the use of the information, errors in third-party data, or the site being unavailable. Decisions about travel, outdoor activities and hunting are always the responsibility of the person making them.</p>
<p>If a translation and the Icelandic text differ, the Icelandic text prevails.</p>`,
hvernig:`<h2>How it works</h2>
<p>This page explains how the scores are produced and how best to read them.</p>
<h3>The 0–100 score</h3>
<p>Each category assesses the weather factors that matter for that activity, at the time of day it takes place. For camping the night temperature matters, for hiking the gusts and cloud on the summits, for the northern lights cloud cover and darkness. Each factor gets a value from 0 to 1 depending on how close it is to ideal conditions, and the factors are weighted into a score. Elevation can lower the score, for example for camping in the highlands.</p>
<table class="einkunnir"><tr><th>80–100</th><td>Excellent conditions</td></tr><tr><th>60–79</th><td>Good conditions</td></tr><tr><th>40–59</th><td>Fair; could work</td></tr><tr><th>20–39</th><td>Poorer conditions</td></tr><tr><th>0–19</th><td>Unsuitable; not shown as a point</td></tr></table>
<h3>What is meaningful</h3>
<ul><li><strong>Small differences:</strong> a difference of 5 points or less between places is within the margin of error. Treat such places as equally good.</li>
<li><strong>Time:</strong> the forecast is more reliable for the next 1–2 days than 4–5 days ahead.</li>
<li><strong>Uncertainty:</strong> when the models disagree, this is shown next to the place. “The models agree” means less than 6 points of difference between models, “some disagreement” 6–12 points and “large disagreement” more than 12 points. Treat scores with large disagreement with caution.</li>
<li><strong>Cell size:</strong> each point represents its whole cell. Valleys, sheltered spots and summits within a cell can differ a great deal.</li></ul>
<h3>Avalanche hazard index</h3>
<p>The avalanche category is different: here a high number is bad. It assesses new snow over the last three days, drifting snow and warming or rain on snow, but not terrain, slope angle or snowpack. A low hazard index never means an area is safe.</p>
<h3>Colours and symbols</h3>
<ul><li><strong>Red points:</strong> the best places, numbered by score.</li>
<li><strong>Green cells:</strong> the score across the whole country; darker is better. In the avalanche category the cells are orange and darker is worse.</li>
<li><strong>“Unchanged”:</strong> the point kept its place since the last update. A point only moves if a new place is meaningfully better, by more than 4 points.</li>
<li><strong>Star:</strong> the best spot within a cell, found with a more detailed search at about 4 km resolution.</li></ul>`}},

sidur:{
um:`<h2>Om siden</h2>
<p>Besti staðurinn (»Det bedste sted«) er et eksperimentelt projekt, der foreslår, hvor i Island vejret bedst kan passe til det, du har tænkt dig at lave. Siden er en idékilde, ikke en vejrprognose og ikke sikkerhedsrådgivning.</p>
<div class="vidvorun"><strong>Stol ikke blindt på det, du ser her.</strong> Vejrmodeller tager fejl, især i bjergene og flere dage frem. Se altid vedur.is, den islandske vejrtjenestes lavineprognose og safetravel.is, før du tager af sted, og stol på din egen vurdering på stedet.</div>
<h3>Hvor data kommer fra</h3>
<ul><li><strong>Vejrmodeller:</strong> ECMWF, HARMONIE-AROME (DMI) og ICON (den tyske vejrtjeneste) samt efter valg GFS, UKMO og Météo-France. Data hentes via Open-Meteo (open-meteo.com), som videreformidler vejrtjenesternes åbne data under licensen CC BY 4.0.</li>
<li><strong>Islands vejrtjeneste:</strong> stationsprognoser fra vedur.is, når de er tilgængelige.</li>
<li><strong>Kort:</strong> OpenTopoMap (CC-BY-SA), baseret på OpenStreetMap og SRTM-højdedata, samt luftfotos fra Esri. Kystlinje fra Natural Earth.</li></ul>
<h3>Sådan virker det</h3>
<p>Landet er opdelt i omkring 150 felter på ca. 28 × 23 km. For hvert felt henter siden prognoser fra flere vejrmodeller, beregner en score for hver model og tager gennemsnittet. De røde punkter er de bedste felter, mindst 30 km fra hinanden. Scorerne forklares under »Sådan virker det«.</p>
<p>Alle beregninger foregår i din browser. Siden indsamler ingen personoplysninger og bruger ingen cookies; den husker kun dine indstillinger i din egen browser. Besøgstælleren tæller åbne forbindelser, ikke hvem der besøger siden.</p>
<h3>Forbehold og ansvar</h3>
<p>Oplysningerne på siden er udelukkende vejledende og gives uden nogen garanti for, at de er korrekte, nøjagtige eller opdaterede. De erstatter ikke officielle vejrprognoser, varsler eller faglig rådgivning.</p>
<p>Brug af siden sker helt på eget ansvar. I det omfang loven tillader det, påtager folkene bag siden sig intet ansvar for skader, ulykker, omkostninger eller gener, der skyldes brugen af oplysningerne, fejl i data fra tredjeparter eller at siden ikke er tilgængelig. Beslutninger om rejser, friluftsliv og jagt er altid den beslutningstagendes ansvar.</p>
<p>Hvis en oversættelse og den islandske tekst afviger fra hinanden, gælder den islandske tekst.</p>`,
hvernig:`<h2>Sådan virker det</h2>
<p>Her forklares, hvordan scorerne bliver til, og hvordan de bedst læses.</p>
<h3>Scoren 0–100</h3>
<p>Hver kategori vurderer de vejrfaktorer, der har betydning for aktiviteten, på det tidspunkt af døgnet hvor den foregår. For camping betyder nattetemperaturen noget, for bjergvandring vindstød og skyer på toppene, for nordlys skydække og mørke. Hver faktor får en værdi fra 0 til 1 efter, hvor tæt den er på ideelle forhold, og faktorerne vægtes sammen til en score. Højden over havet kan sænke scoren, for eksempel for camping i højlandet.</p>
<table class="einkunnir"><tr><th>80–100</th><td>Fremragende forhold</td></tr><tr><th>60–79</th><td>Gode forhold</td></tr><tr><th>40–59</th><td>Rimelige; kan gå</td></tr><tr><th>20–39</th><td>Dårligere forhold</td></tr><tr><th>0–19</th><td>Uegnet; vises ikke som punkt</td></tr></table>
<h3>Hvad er betydningsfuldt</h3>
<ul><li><strong>Små forskelle:</strong> en forskel på 5 point eller mindre mellem steder ligger inden for usikkerheden. Betragt sådanne steder som lige gode.</li>
<li><strong>Tid:</strong> prognosen er mere pålidelig for de næste 1–2 dage end 4–5 dage frem.</li>
<li><strong>Usikkerhed:</strong> når modellerne er uenige, vises det ved stedet. »Modellerne er enige« betyder under 6 points forskel mellem modellerne, »nogen uenighed« 6–12 point og »stor uenighed« over 12 point. Tag scorer med stor uenighed med forbehold.</li>
<li><strong>Feltstørrelse:</strong> hvert punkt repræsenterer hele sit felt. Dale, læ og toppe inden for feltet kan være meget forskellige.</li></ul>
<h3>Lavinefareindeks</h3>
<p>Lavinekategorien er anderledes: her er et højt tal dårligt. Den vurderer nysne de seneste tre døgn, snefygning og opvarmning eller regn på sne, men ikke terræn, hældning eller snedække. Et lavt fareindeks betyder aldrig, at et område er sikkert.</p>
<h3>Farver og symboler</h3>
<ul><li><strong>Røde punkter:</strong> de bedste steder, nummereret efter score.</li>
<li><strong>Grønne felter:</strong> scoren for hele landet; mørkere er bedre. I lavinekategorien er felterne orange, og mørkere er værre.</li>
<li><strong>»Uændret«:</strong> punktet har beholdt sin plads siden sidste opdatering. Et punkt flytter sig kun, hvis et nyt sted er betydeligt bedre, med mere end 4 point.</li>
<li><strong>Stjerne:</strong> det bedste sted inden for et felt, fundet med en mere detaljeret søgning med ca. 4 km opløsning.</li></ul>`}},

sidur:{
um:`<h2>Om sidan</h2>
<p>Besti staðurinn (”Den bästa platsen”) är ett experimentellt projekt som föreslår var på Island vädret kan passa bäst för det du tänker göra. Sidan är en idékälla, inte en väderprognos och inte säkerhetsrådgivning.</p>
<div class="vidvorun"><strong>Lita inte blint på det du ser här.</strong> Vädermodeller har fel, särskilt i fjällen och flera dagar framåt. Kontrollera alltid vedur.is, isländska meteorologiska institutets lavinprognos och safetravel.is innan du ger dig av, och lita på ditt eget omdöme på plats.</div>
<h3>Var data kommer ifrån</h3>
<ul><li><strong>Vädermodeller:</strong> ECMWF, HARMONIE-AROME (DMI) och ICON (tyska vädertjänsten), samt valfritt GFS, UKMO och Météo-France. Data hämtas via Open-Meteo (open-meteo.com), som förmedlar vädertjänsternas öppna data under licensen CC BY 4.0.</li>
<li><strong>Isländska meteorologiska institutet:</strong> stationsprognoser från vedur.is, när de finns tillgängliga.</li>
<li><strong>Kartor:</strong> OpenTopoMap (CC-BY-SA), baserad på OpenStreetMap och SRTM-höjddata, samt flygfoton från Esri. Kustlinje från Natural Earth.</li></ul>
<h3>Så fungerar det</h3>
<p>Landet är indelat i ungefär 150 rutor på ca 28 × 23 km. För varje ruta hämtar sidan prognoser från flera vädermodeller, beräknar en poäng för varje modell och tar medelvärdet. De röda punkterna är de bästa rutorna, minst 30 km från varandra. Poängen förklaras under ”Så fungerar det”.</p>
<p>Alla beräkningar sker i din webbläsare. Sidan samlar inte in några personuppgifter och använder inga kakor; den minns bara dina inställningar i din egen webbläsare. Besöksräknaren räknar öppna anslutningar, inte vilka som besöker sidan.</p>
<h3>Friskrivning och ansvar</h3>
<p>Informationen på sidan är endast vägledande och tillhandahålls utan någon garanti för att den är korrekt, exakt eller aktuell. Den ersätter inte officiella väderprognoser, varningar eller professionell rådgivning.</p>
<p>Användning av sidan sker helt på egen risk. I den utsträckning lagen tillåter tar personerna bakom sidan inget ansvar för skador, olyckor, kostnader eller olägenheter som beror på användningen av informationen, fel i data från tredje part eller att sidan inte är tillgänglig. Beslut om resor, friluftsliv och jakt är alltid den beslutandes ansvar.</p>
<p>Om en översättning och den isländska texten skiljer sig åt gäller den isländska texten.</p>`,
hvernig:`<h2>Så fungerar det</h2>
<p>Här förklaras hur poängen tas fram och hur de bäst läses.</p>
<h3>Poängen 0–100</h3>
<p>Varje kategori bedömer de väderfaktorer som spelar roll för aktiviteten, vid den tid på dygnet då den äger rum. För camping spelar nattemperaturen roll, för fjällvandring byarna och molnen på topparna, för norrsken molnigheten och mörkret. Varje faktor får ett värde från 0 till 1 beroende på hur nära idealförhållanden den ligger, och faktorerna vägs samman till en poäng. Höjden över havet kan sänka poängen, till exempel för camping i höglandet.</p>
<table class="einkunnir"><tr><th>80–100</th><td>Utmärkta förhållanden</td></tr><tr><th>60–79</th><td>Goda förhållanden</td></tr><tr><th>40–59</th><td>Hyggliga; kan fungera</td></tr><tr><th>20–39</th><td>Sämre förhållanden</td></tr><tr><th>0–19</th><td>Olämpligt; visas inte som punkt</td></tr></table>
<h3>Vad är meningsfullt</h3>
<ul><li><strong>Små skillnader:</strong> en skillnad på 5 poäng eller mindre mellan platser ligger inom felmarginalen. Betrakta sådana platser som lika bra.</li>
<li><strong>Tid:</strong> prognosen är mer tillförlitlig för de närmaste 1–2 dagarna än 4–5 dagar framåt.</li>
<li><strong>Osäkerhet:</strong> när modellerna är oense visas det vid platsen. ”Modellerna är överens” betyder mindre än 6 poängs skillnad mellan modellerna, ”viss oenighet” 6–12 poäng och ”stor oenighet” mer än 12 poäng. Ta poäng med stor oenighet med en nypa salt.</li>
<li><strong>Rutstorlek:</strong> varje punkt representerar hela sin ruta. Dalar, lä och toppar inom rutan kan skilja sig mycket.</li></ul>
<h3>Lavinriskindex</h3>
<p>Lavinkategorin är annorlunda: här är ett högt tal dåligt. Den bedömer nysnö de senaste tre dygnen, snödrev och uppvärmning eller regn på snö, men inte terräng, lutning eller snötäcke. Ett lågt riskindex betyder aldrig att ett område är säkert.</p>
<h3>Färger och symboler</h3>
<ul><li><strong>Röda punkter:</strong> de bästa platserna, numrerade efter poäng.</li>
<li><strong>Gröna rutor:</strong> poängen för hela landet; mörkare är bättre. I lavinkategorin är rutorna orange och mörkare är sämre.</li>
<li><strong>”Oförändrad”:</strong> punkten har behållit sin plats sedan senaste uppdateringen. En punkt flyttas bara om en ny plats är betydligt bättre, med mer än 4 poäng.</li>
<li><strong>Stjärna:</strong> den bästa platsen i en ruta, hittad med en mer detaljerad sökning med ca 4 km upplösning.</li></ul>`}},

utilega:['Biwak','Ciepły dzień, łagodna noc, bezwietrznie i sucho, od południa do 9 rano następnego dnia.',''],
rjupa:['Polowanie na pardwy','Słaby wiatr, dobra widoczność na wrzosowiskach i zboczach, sucho. Świeży śnieg ułatwia tropienie.','Sprawdź dozwolone dni i obszary polowań przed wyjazdem.'],
fjall:['Wędrówki górskie','Mało porywów, bezchmurne szczyty, sucho i dobra widoczność między 8 a 18.','Zimą sprawdź prognozę lawinową Islandzkiego Instytutu Meteorologicznego i zostaw plan podróży na safetravel.is.'],
nordurljos:['Zorza polarna','Bezchmurny i ciemny wieczór z dala od świateł miast, między 21 a 2.','Ocenia się tu tylko zachmurzenie i ciemność. Samą aktywność zorzy pokazuje prognoza zorzy Islandzkiego Instytutu Meteorologicznego.'],
hjol:['Kolarstwo','Słaby wiatr i mało porywów, sucho i łagodnie między 9 a 19.',''],
skidi:['Narciarstwo biegowe','Dość śniegu, zimno, ale nie przenikliwie, słaby wiatr i jasno między 9 a 17.','Grubość pokrywy śnieżnej pochodzi z modeli i może być bardzo niedokładna. Sprawdź warunki na miejscu.'],
sund:['Baseny i gorące źródła','Bezwietrznie i sucho, by przyjemnie było posiedzieć w gorącym basenie na zewnątrz, między 10 a 21.',''],
alpaskidi:['Narciarstwo zjazdowe','Porównanie islandzkich ośrodków narciarskich: dość śniegu, wiatr na tyle słaby, by działały wyciągi, dobra widoczność i umiarkowany mróz między 10 a 17.','Godziny otwarcia i stan wyciągów nie są tu pokazane. Sprawdź stronę ośrodka przed wyjazdem.'],
snjoflod:['Zagrożenie lawinowe','Pokazuje, gdzie pogoda zwiększa prawdopodobieństwo lawin: dużo świeżego śniegu, zawieje przy silnym wietrze oraz ocieplenie lub deszcz na śnieg. To nie jest prognoza lawinowa.','<strong>To nie jest prognoza lawinowa i nie mówi nic o tym, czy obszar jest bezpieczny.</strong> Ocenia się tylko czynniki pogodowe z modeli, a nie ukształtowanie terenu, nachylenie stoku ani pokrywę śnieżną. Niski wskaźnik nie oznacza niskiego zagrożenia. Przed wyjściem w góry zimą zawsze sprawdź prognozę lawinową na vedur.is.']},
sidur:{
um:`<h2>O stronie</h2>
<p>Besti staðurinn („Najlepsze miejsce”) to eksperymentalny projekt, który podpowiada, gdzie na Islandii pogoda może najlepiej pasować do Twoich planów. Strona jest źródłem pomysłów, a nie prognozą pogody ani poradą dotyczącą bezpieczeństwa.</p>
<div class="vidvorun"><strong>Nie ufaj ślepo temu, co tu widzisz.</strong> Modele pogodowe się mylą, zwłaszcza w górach i na kilka dni naprzód. Przed wyjazdem zawsze sprawdź vedur.is, prognozę lawinową Islandzkiego Instytutu Meteorologicznego i safetravel.is, a na miejscu kieruj się własnym osądem.</div>
<h3>Skąd pochodzą dane</h3>
<ul><li><strong>Modele pogodowe:</strong> ECMWF, HARMONIE-AROME (DMI) i ICON (niemiecka służba meteorologiczna), a opcjonalnie GFS, UKMO i Météo-France. Dane są pobierane przez Open-Meteo (open-meteo.com), który udostępnia otwarte dane służb meteorologicznych na licencji CC BY 4.0.</li>
<li><strong>Islandzki Instytut Meteorologiczny:</strong> prognozy dla stacji z vedur.is, gdy są dostępne.</li>
<li><strong>Mapy:</strong> OpenTopoMap (CC-BY-SA), oparta na OpenStreetMap i danych wysokościowych SRTM, oraz zdjęcia satelitarne Esri. Linia brzegowa z Natural Earth.</li></ul>
<h3>Jak to działa</h3>
<p>Kraj jest podzielony na około 150 pól o wymiarach ok. 28 × 23 km. Dla każdego pola strona pobiera prognozy z kilku modeli, oblicza wynik dla każdego modelu i bierze średnią. Czerwone punkty to najlepsze pola, oddalone od siebie o co najmniej 30 km. Wyniki wyjaśniono w sekcji „Jak to działa”.</p>
<p>Wszystkie obliczenia odbywają się w Twojej przeglądarce. Strona nie zbiera danych osobowych i nie używa plików cookie; zapamiętuje jedynie Twoje ustawienia w Twojej przeglądarce. Licznik odwiedzających liczy otwarte połączenia, a nie to, kto odwiedza stronę.</p>
<h3>Zastrzeżenie i odpowiedzialność</h3>
<p>Informacje na stronie mają charakter wyłącznie orientacyjny i są udostępniane bez jakiejkolwiek gwarancji ich poprawności, dokładności lub aktualności. Nie zastępują oficjalnych prognoz pogody, ostrzeżeń ani porad specjalistów.</p>
<p>Korzystasz ze strony wyłącznie na własne ryzyko. W zakresie dozwolonym przez prawo twórcy strony nie ponoszą odpowiedzialności za szkody, wypadki, koszty lub niedogodności wynikające z korzystania z informacji, błędów w danych osób trzecich lub niedostępności strony. Decyzje dotyczące podróży, aktywności na świeżym powietrzu i polowań zawsze należą do osoby, która je podejmuje.</p>
<p>W razie rozbieżności między tłumaczeniem a tekstem islandzkim rozstrzyga tekst islandzki.</p>`,
hvernig:`<h2>Jak to działa</h2>
<p>Tutaj wyjaśniamy, jak powstają wyniki i jak najlepiej je odczytywać.</p>
<h3>Wynik 0–100</h3>
<p>Każda kategoria ocenia czynniki pogodowe ważne dla danej aktywności, o tej porze dnia, w której się odbywa. Dla biwaku liczy się temperatura w nocy, dla wędrówek górskich porywy wiatru i chmury na szczytach, dla zorzy polarnej zachmurzenie i ciemność. Każdy czynnik otrzymuje wartość od 0 do 1 w zależności od tego, jak blisko jest warunków idealnych, a czynniki są ważone w jeden wynik. Wysokość nad poziomem morza może obniżyć wynik, na przykład dla biwaku w interiorze.</p>
<table class="einkunnir"><tr><th>80–100</th><td>Doskonałe warunki</td></tr><tr><th>60–79</th><td>Dobre warunki</td></tr><tr><th>40–59</th><td>Przeciętne; może się udać</td></tr><tr><th>20–39</th><td>Słabsze warunki</td></tr><tr><th>0–19</th><td>Nieodpowiednie; nie pokazywane jako punkt</td></tr></table>
<h3>Co jest istotne</h3>
<ul><li><strong>Małe różnice:</strong> różnica 5 punktów lub mniej między miejscami mieści się w granicach błędu. Traktuj takie miejsca jako równie dobre.</li>
<li><strong>Czas:</strong> prognoza jest bardziej wiarygodna na najbliższe 1–2 dni niż na 4–5 dni naprzód.</li>
<li><strong>Niepewność:</strong> gdy modele się różnią, jest to pokazane przy miejscu. „Modele są zgodne” oznacza różnicę poniżej 6 punktów między modelami, „pewne rozbieżności” 6–12 punktów, a „duże rozbieżności” ponad 12 punktów. Wyniki z dużymi rozbieżnościami traktuj ostrożnie.</li>
<li><strong>Wielkość pola:</strong> każdy punkt reprezentuje całe swoje pole. Doliny, osłonięte miejsca i szczyty w obrębie pola mogą się bardzo różnić.</li></ul>
<h3>Wskaźnik zagrożenia lawinowego</h3>
<p>Kategoria lawinowa jest inna: tutaj wysoka liczba jest zła. Ocenia świeży śnieg z ostatnich trzech dób, zawieje oraz ocieplenie lub deszcz na śnieg, ale nie ukształtowanie terenu, nachylenie stoku ani pokrywę śnieżną. Niski wskaźnik nigdy nie oznacza, że obszar jest bezpieczny.</p>
<h3>Kolory i oznaczenia</h3>
<ul><li><strong>Czerwone punkty:</strong> najlepsze miejsca, ponumerowane według wyniku.</li>
<li><strong>Zielone pola:</strong> wynik dla całego kraju; ciemniejszy oznacza lepszy. W kategorii lawinowej pola są pomarańczowe, a ciemniejszy oznacza gorszy.</li>
<li><strong>„Bez zmian”:</strong> punkt zachował swoje miejsce od ostatniej aktualizacji. Punkt przesuwa się tylko wtedy, gdy nowe miejsce jest wyraźnie lepsze, o ponad 4 punkty.</li>
<li><strong>Gwiazdka:</strong> najlepsze miejsce w polu, znalezione dokładniejszym wyszukiwaniem w rozdzielczości ok. 4 km.</li></ul>`}},

sidur:{
um:`<h2>À propos</h2>
<p>Besti staðurinn (« Le meilleur endroit ») est un projet expérimental qui suggère où, en Islande, la météo pourrait le mieux convenir à ce que vous prévoyez de faire. Le site est une source d’idées, ni une prévision météorologique ni un conseil de sécurité.</p>
<div class="vidvorun"><strong>Ne vous fiez pas aveuglément à ce que vous voyez ici.</strong> Les modèles météo se trompent, surtout en montagne et à plusieurs jours d’échéance. Consultez toujours vedur.is, le bulletin d’avalanches de l’Office météorologique islandais et safetravel.is avant de partir, et fiez-vous à votre propre jugement sur place.</div>
<h3>D’où viennent les données</h3>
<ul><li><strong>Modèles météo :</strong> ECMWF, HARMONIE-AROME (DMI) et ICON (service météorologique allemand), et en option GFS, UKMO et Météo-France. Les données sont récupérées via Open-Meteo (open-meteo.com), qui diffuse les données ouvertes des services météorologiques sous licence CC BY 4.0.</li>
<li><strong>Office météorologique islandais :</strong> prévisions par station de vedur.is, lorsqu’elles sont disponibles.</li>
<li><strong>Cartes :</strong> OpenTopoMap (CC-BY-SA), basée sur OpenStreetMap et les données d’altitude SRTM, et images satellite d’Esri. Trait de côte de Natural Earth.</li></ul>
<h3>Fonctionnement</h3>
<p>Le pays est divisé en environ 150 cases d’environ 28 × 23 km. Pour chaque case, la page récupère les prévisions de plusieurs modèles, calcule une note pour chaque modèle et en fait la moyenne. Les points rouges sont les meilleures cases, distantes d’au moins 30 km. Les notes sont expliquées dans la rubrique « Fonctionnement ».</p>
<p>Tous les calculs s’effectuent dans votre navigateur. Le site ne collecte aucune donnée personnelle et n’utilise pas de cookies ; il mémorise seulement vos paramètres dans votre propre navigateur. Le compteur de visiteurs compte les connexions ouvertes, pas l’identité des visiteurs.</p>
<h3>Avertissement et responsabilité</h3>
<p>Les informations de ce site sont purement indicatives et fournies sans aucune garantie quant à leur exactitude, leur précision ou leur actualité. Elles ne remplacent pas les prévisions météorologiques officielles, les alertes ou les conseils de professionnels.</p>
<p>Vous utilisez le site entièrement à vos propres risques. Dans la mesure permise par la loi, les responsables du site déclinent toute responsabilité pour les dommages, accidents, frais ou désagréments découlant de l’utilisation des informations, d’erreurs dans les données de tiers ou de l’indisponibilité du site. Les décisions concernant les déplacements, les activités de plein air et la chasse relèvent toujours de la personne qui les prend.</p>
<p>En cas de divergence entre une traduction et le texte islandais, le texte islandais fait foi.</p>`,
hvernig:`<h2>Fonctionnement</h2>
<p>Cette page explique comment les notes sont calculées et comment les lire au mieux.</p>
<h3>La note de 0 à 100</h3>
<p>Chaque catégorie évalue les facteurs météorologiques importants pour l’activité, au moment de la journée où elle a lieu. Pour le camping, la température nocturne compte ; pour la randonnée, les rafales et les nuages sur les sommets ; pour les aurores boréales, la nébulosité et l’obscurité. Chaque facteur reçoit une valeur de 0 à 1 selon sa proximité avec les conditions idéales, et les facteurs sont pondérés en une note. L’altitude peut abaisser la note, par exemple pour le camping dans les hautes terres.</p>
<table class="einkunnir"><tr><th>80–100</th><td>Conditions excellentes</td></tr><tr><th>60–79</th><td>Bonnes conditions</td></tr><tr><th>40–59</th><td>Correctes ; ça peut aller</td></tr><tr><th>20–39</th><td>Conditions moins bonnes</td></tr><tr><th>0–19</th><td>Inadapté ; non affiché comme point</td></tr></table>
<h3>Ce qui est significatif</h3>
<ul><li><strong>Petites différences :</strong> un écart de 5 points ou moins entre deux endroits est dans la marge d’erreur. Considérez ces endroits comme équivalents.</li>
<li><strong>Échéance :</strong> la prévision est plus fiable pour les 1 à 2 prochains jours qu’à 4 ou 5 jours.</li>
<li><strong>Incertitude :</strong> lorsque les modèles divergent, cela est indiqué à côté de l’endroit. « Les modèles sont d’accord » signifie moins de 6 points d’écart entre modèles, « quelques divergences » 6 à 12 points et « fortes divergences » plus de 12 points. Prenez les notes à forte divergence avec prudence.</li>
<li><strong>Taille des cases :</strong> chaque point représente toute sa case. Vallées, abris et sommets à l’intérieur d’une case peuvent être très différents.</li></ul>
<h3>Indice de risque d’avalanche</h3>
<p>La catégorie avalanche est différente : ici, un chiffre élevé est mauvais. Elle évalue la neige fraîche des trois derniers jours, le transport de neige par le vent et le redoux ou la pluie sur la neige, mais pas le terrain, la pente ni le manteau neigeux. Un indice faible ne signifie jamais qu’une zone est sûre.</p>
<h3>Couleurs et symboles</h3>
<ul><li><strong>Points rouges :</strong> les meilleurs endroits, numérotés selon leur note.</li>
<li><strong>Cases vertes :</strong> la note sur tout le pays ; plus foncé est meilleur. Dans la catégorie avalanche, les cases sont orange et plus foncé est pire.</li>
<li><strong>« Inchangé » :</strong> le point a conservé sa place depuis la dernière mise à jour. Un point ne se déplace que si un nouvel endroit est nettement meilleur, de plus de 4 points.</li>
<li><strong>Étoile :</strong> le meilleur endroit d’une case, trouvé par une recherche plus fine à environ 4 km de résolution.</li></ul>`}},

sidur:{
um:`<h2>关于</h2>
<p>Besti staðurinn（“最佳地点”）是一个实验性项目，提示冰岛哪些地方的天气可能最适合你的计划。本网站只是提供想法，既不是天气预报，也不是安全建议。</p>
<div class="vidvorun"><strong>请勿盲目相信这里显示的信息。</strong>天气模型会出错，尤其是在山区和数天之后的预报。出发前请务必查看 vedur.is、冰岛气象局的雪崩预报和 safetravel.is，并在现场依靠自己的判断。</div>
<h3>数据来源</h3>
<ul><li><strong>天气模型：</strong>ECMWF、HARMONIE-AROME（丹麦气象研究所）和 ICON（德国气象局），以及可选的 GFS、UKMO 和法国气象局。数据通过 Open-Meteo（open-meteo.com）获取，该平台以 CC BY 4.0 许可分发各气象机构的开放数据。</li>
<li><strong>冰岛气象局：</strong>来自 vedur.is 的站点预报（如可用）。</li>
<li><strong>地图：</strong>OpenTopoMap（CC-BY-SA），基于 OpenStreetMap 和 SRTM 高程数据；卫星图像来自 Esri。海岸线来自 Natural Earth。</li></ul>
<h3>工作原理</h3>
<p>全国被划分为约 150 个网格，每个约 28 × 23 公里。页面为每个网格获取多个天气模型的预报，分别计算每个模型的评分并取平均值。红点是最佳网格，彼此相距至少 30 公里。评分的详细说明请见“使用说明”。</p>
<p>所有计算都在你的浏览器中进行。本网站不收集任何个人信息，也不使用 Cookie；只会在你自己的浏览器中记住你的设置。访客计数器统计的是在线连接数，而不是访客身份。</p>
<h3>免责声明与责任</h3>
<p>本网站上的信息仅供参考，不对其正确性、准确性或时效性作任何保证。这些信息不能替代官方天气预报、预警或专业人士的建议。</p>
<p>使用本网站的风险完全由你自行承担。在法律允许的范围内，网站运营者对因使用这些信息、第三方数据错误或网站无法访问而造成的任何损失、事故、费用或不便概不负责。有关出行、户外活动和狩猎的决定始终由做出决定的人负责。</p>
<p>如译文与冰岛语原文不一致，以冰岛语原文为准。</p>`,
hvernig:`<h2>使用说明</h2>
<p>本页说明评分是如何得出的，以及如何更好地理解它们。</p>
<h3>0–100 评分</h3>
<p>每个类别都会评估对该活动重要的天气因素，并针对活动进行的时段。露营看重夜间温度，登山看重阵风和山顶云层，观赏北极光看重云量和黑暗程度。每个因素根据其接近理想条件的程度获得 0 到 1 的分值，再加权合成为一个评分。海拔可能降低评分，例如在高地露营。</p>
<table class="einkunnir"><tr><th>80–100</th><td>条件极佳</td></tr><tr><th>60–79</th><td>条件良好</td></tr><tr><th>40–59</th><td>条件一般，或许可行</td></tr><tr><th>20–39</th><td>条件较差</td></tr><tr><th>0–19</th><td>不适合，不显示为地点</td></tr></table>
<h3>哪些差异有意义</h3>
<ul><li><strong>小差异：</strong>地点之间相差 5 分或更少属于误差范围，可视为同样好。</li>
<li><strong>时间：</strong>未来 1–2 天的预报比 4–5 天后的预报更可靠。</li>
<li><strong>不确定性：</strong>模型之间有分歧时，会在地点旁注明。“各模型结果一致”表示模型间差异小于 6 分，“有一定分歧”为 6–12 分，“分歧很大”为超过 12 分。分歧很大的评分请谨慎参考。</li>
<li><strong>网格大小：</strong>每个地点代表整个网格。网格内的山谷、避风处和山顶可能差别很大。</li></ul>
<h3>雪崩危险指数</h3>
<p>雪崩类别有所不同：这里数值越高越不利。它评估过去三天的新雪、风吹雪以及升温或雨落雪上，但不评估地形、坡度或积雪层结构。危险指数低绝不意味着某地区是安全的。</p>
<h3>颜色与标记</h3>
<ul><li><strong>红点：</strong>最佳地点，按评分编号。</li>
<li><strong>绿色网格：</strong>全国范围的评分，颜色越深越好。在雪崩类别中网格为橙色，颜色越深越不利。</li>
<li><strong>“未变”：</strong>该地点自上次更新以来保持不变。只有当新地点明显更好（高出 4 分以上）时，地点才会移动。</li>
<li><strong>星号：</strong>网格内的最佳地点，通过约 4 公里分辨率的精细搜索找到。</li></ul>`}},

sidur:{
um:`<h2>Acerca de</h2>
<p>Besti staðurinn («El mejor lugar») es un proyecto experimental que sugiere dónde en Islandia el tiempo puede adaptarse mejor a lo que tienes pensado hacer. La página es una fuente de ideas, no una previsión meteorológica ni un consejo de seguridad.</p>
<div class="vidvorun"><strong>No confíes ciegamente en lo que ves aquí.</strong> Los modelos meteorológicos se equivocan, sobre todo en la montaña y a varios días vista. Consulta siempre vedur.is, el boletín de aludes de la Oficina Meteorológica de Islandia y safetravel.is antes de salir, y confía en tu propio criterio sobre el terreno.</div>
<h3>De dónde vienen los datos</h3>
<ul><li><strong>Modelos meteorológicos:</strong> ECMWF, HARMONIE-AROME (DMI) e ICON (Servicio Meteorológico Alemán), y opcionalmente GFS, UKMO y Météo-France. Los datos se obtienen a través de Open-Meteo (open-meteo.com), que distribuye los datos abiertos de los servicios meteorológicos con licencia CC BY 4.0.</li>
<li><strong>Oficina Meteorológica de Islandia:</strong> previsiones por estación de vedur.is, cuando están disponibles.</li>
<li><strong>Mapas:</strong> OpenTopoMap (CC-BY-SA), basado en OpenStreetMap y datos de elevación SRTM, e imágenes de satélite de Esri. Línea de costa de Natural Earth.</li></ul>
<h3>Cómo funciona</h3>
<p>El país está dividido en unas 150 celdas de aproximadamente 28 × 23 km. Para cada celda, la página obtiene previsiones de varios modelos, calcula una puntuación para cada modelo y hace la media. Los puntos rojos son las mejores celdas, separadas al menos 30 km. Las puntuaciones se explican en «Cómo funciona».</p>
<p>Todos los cálculos se realizan en tu navegador. La página no recoge datos personales ni usa cookies; solo recuerda tus ajustes en tu propio navegador. El contador de visitantes cuenta conexiones abiertas, no quién visita la página.</p>
<h3>Aviso legal y responsabilidad</h3>
<p>La información de esta página es meramente orientativa y se ofrece sin ninguna garantía sobre su exactitud, precisión o actualidad. No sustituye a las previsiones meteorológicas oficiales, los avisos ni el consejo de profesionales.</p>
<p>El uso de la página es enteramente bajo tu propia responsabilidad. En la medida en que lo permita la ley, los responsables de la página no asumen ninguna responsabilidad por daños, accidentes, costes o molestias derivados del uso de la información, de errores en datos de terceros o de que la página no esté disponible. Las decisiones sobre viajes, actividades al aire libre y caza son siempre responsabilidad de quien las toma.</p>
<p>En caso de discrepancia entre una traducción y el texto islandés, prevalece el texto islandés.</p>`,
hvernig:`<h2>Cómo funciona</h2>
<p>Aquí se explica cómo se obtienen las puntuaciones y cómo interpretarlas mejor.</p>
<h3>La puntuación de 0 a 100</h3>
<p>Cada categoría evalúa los factores meteorológicos que importan para esa actividad, en el momento del día en que se realiza. Para acampar importa la temperatura nocturna; para el senderismo, las rachas y las nubes en las cumbres; para las auroras, la nubosidad y la oscuridad. Cada factor recibe un valor de 0 a 1 según lo cerca que esté de las condiciones ideales, y los factores se ponderan en una puntuación. La altitud puede reducir la puntuación, por ejemplo para acampar en las tierras altas.</p>
<table class="einkunnir"><tr><th>80–100</th><td>Condiciones excelentes</td></tr><tr><th>60–79</th><td>Buenas condiciones</td></tr><tr><th>40–59</th><td>Aceptables; podría funcionar</td></tr><tr><th>20–39</th><td>Condiciones peores</td></tr><tr><th>0–19</th><td>No adecuado; no se muestra como punto</td></tr></table>
<h3>Qué es significativo</h3>
<ul><li><strong>Diferencias pequeñas:</strong> una diferencia de 5 puntos o menos entre lugares está dentro del margen de error. Considera esos lugares igual de buenos.</li>
<li><strong>Plazo:</strong> la previsión es más fiable para los próximos 1–2 días que a 4–5 días vista.</li>
<li><strong>Incertidumbre:</strong> cuando los modelos discrepan, se indica junto al lugar. «Los modelos coinciden» significa menos de 6 puntos de diferencia entre modelos, «cierta discrepancia» de 6 a 12 puntos y «gran discrepancia» más de 12 puntos. Toma con cautela las puntuaciones con gran discrepancia.</li>
<li><strong>Tamaño de las celdas:</strong> cada punto representa toda su celda. Los valles, los lugares resguardados y las cumbres dentro de una celda pueden ser muy distintos.</li></ul>
<h3>Índice de peligro de aludes</h3>
<p>La categoría de aludes es distinta: aquí un número alto es malo. Evalúa la nieve nueva de los últimos tres días, la ventisca y la subida de temperatura o la lluvia sobre nieve, pero no el terreno, la pendiente ni el manto de nieve. Un índice bajo nunca significa que una zona sea segura.</p>
<h3>Colores y símbolos</h3>
<ul><li><strong>Puntos rojos:</strong> los mejores lugares, numerados según su puntuación.</li>
<li><strong>Celdas verdes:</strong> la puntuación en todo el país; más oscuro es mejor. En la categoría de aludes las celdas son naranjas y más oscuro es peor.</li>
<li><strong>«Sin cambios»:</strong> el punto ha mantenido su lugar desde la última actualización. Un punto solo se mueve si un lugar nuevo es claramente mejor, por más de 4 puntos.</li>
<li><strong>Estrella:</strong> el mejor punto dentro de una celda, encontrado con una búsqueda más detallada de unos 4 km de resolución.</li></ul>`}},

 hv:'<h3>Ostrzeżenia Islandzkiego Instytutu Meteorologicznego</h3><p>Gdy strona jest skonfigurowana z automatycznym pobieraniem danych, na mapie pojawiają się żółte, pomarańczowe i czerwone ostrzeżenia instytutu. Miejsca w obszarze ostrzeżenia otrzymują niższy wynik: żółte ostrzeżenie obniża go o 15%, pomarańczowe o 40%, a czerwone o 70%. Ostrzeżenia są aktualizowane co dwie godziny, więc mogą być lekko opóźnione; vedur.is jest zawsze źródłem rozstrzygającym.</p><h3>Najgorsza pogoda</h3><p>W tej kategorii wysoka liczba jest zła: wskaźnik burzy pokazuje, jak wietrznie, zimno i mokro jest, a czerwone punkty pokazują, gdzie pogoda jest najgorsza.</p>'},

 hv:'<h3>Alertes de l’Office météorologique islandais</h3><p>Lorsque le site est configuré avec la récupération automatique des données, les alertes jaunes, orange et rouges de l’Office météorologique islandais apparaissent sur la carte. Les endroits situés dans une zone d’alerte reçoivent une note plus basse : une alerte jaune la réduit de 15 %, orange de 40 % et rouge de 70 %. Les alertes sont mises à jour toutes les deux heures et peuvent donc avoir un léger retard ; vedur.is reste toujours la source de référence.</p><h3>Pire météo</h3><p>Dans cette catégorie, un chiffre élevé est mauvais : l’indice de tempête indique à quel point il fait venteux, froid et humide, et les points rouges montrent où la météo est la pire.</p>'},

 hv2:'<h3>Topp 5, 10 eða 20</h3><p>Þú velur hve marga staði þú vilt sjá. Fleiri staðir þýða að neðri sætin hafa lægri einkunn; einkunnin segir alltaf til um gæðin.</p><h3>Hverju á ég að klæðast?</h3><p>Veldu staðsetningu með GPS, með því að slá inn bæ eða smella á kortið. Síðan sækir spá fyrir nákvæmlega þann stað og stingur upp á klæðnaði fyrir valinn flokk og tíma: lög af fötum, hvað á að taka með og hvað er gott að vita. Tekið er tillit til vindkælingar, úrkomu, hálku, hreyfingar og myrkurs. Staðsetningin er aðeins notuð í vafranum þínum og til að sækja spá; hún er ekki send annað. Þetta eru almennar uppástungur; klæddu þig alltaf eftir aðstæðum og reynslu.</p>'},

const bunkar=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r;};
async function saekjaLikan(likan,punktar=PUNKTAR){
  const ut=[];

    const url='https://api.open-meteo.com/v1/forecast?'+new URLSearchParams({
      latitude:b.map(p=>p.lat).join(','),longitude:b.map(p=>p.lon).join(','),hourly:BREYTUR,models:likan,
      wind_speed_unit:'ms',timezone:'GMT',forecast_days:DAGAR,past_days:FORTID});
    const r=await fetch(url);
    if(!r.ok){let s='';try{s=(await r.json()).reason||'';}catch{}throw new Error(s||`villa ${r.status}`);}
    let j=await r.json();if(!Array.isArray(j))j=[j];ut.push(...j);
  }

}

const VID_STIG={gul:1,appelsinugul:2,raud:3},VID_STUDULL={gul:.85,appelsinugul:.6,raud:.3};
const VID_HEITI={gul:'vid_gul',appelsinugul:'vid_appels',raud:'vid_raud'};

function umbreyta(svor,likan,gogn,punktar=PUNKTAR){
  svor.forEach((s,i)=>{
    const p=punktar[i],h=s.hourly||{};
    if(!S.timar.length&&h.time)S.timar=h.time;
    if(p.haed==null&&s.elevation!=null)p.haed=s.elevation;
    const ar={T:h.temperature_2m,W:h.wind_speed_10m,G:h.wind_gusts_10m,P:h.precipitation,C:h.cloud_cover,CL:h.cloud_cover_low,
      S:h.sunshine_duration,V:h.visibility,SD:h.snow_depth,SF:h.snowfall};
    if(!ar.T||ar.T.every(v=>v==null))return; // líkanið nær ekki yfir punktinn

const SOL_ORD=[["heiðskírt",1],["léttskýjað",.75],["hálfskýjað",.55],["alskýjað",.1],["skýjað",.35],["skúr",.25],["él",.2],["súld",.05],["rigning",0],["slydda",0],["snjókoma",0],["þoka",0]];
function baetaVidVedurIs(vi,gogn){
  // Spá Veðurstofunnar fyrir stöð verður aukameðlimur í samsafni grindarpunkta innan 20 km
  for(const st of vi.stodvar){
    const T=[],W=[],P=[],SL=[];
    for(let k=0;k<S.timar.length;k++){
      const t=Date.parse(S.timar[k]+'Z');let besta=null,bd=7200001;
      for(const sp of st.spa){const d=Math.abs(Date.parse(sp.t+'Z')-t);if(d<bd){bd=d;besta=sp;}}
      const ok=besta&&bd<=7200000;
      T.push(ok?besta.T:null);W.push(ok?besta.F:null);P.push(ok&&besta.R!=null?besta.R:null);
      let sol=null;if(ok&&besta.W){const w=besta.W.toLowerCase();const f=SOL_ORD.find(([o])=>w.includes(o));if(f)sol=f[1]*3600;}
      SL.push(sol);
    }
    if(T.every(v=>v==null))continue;
    for(const p of PUNKTAR){
      if(km(p,st)>20||!gogn[p.id])continue;
      const adrir=Object.values(gogn[p.id]);
      const medal=lykill=>S.timar.map((_,k)=>{const g=adrir.map(a=>a[lykill]?.[k]).filter(v=>v!=null);return g.length?g.reduce((a,b)=>a+b)/g.length:null;});
      gogn[p.id]['vedur_is']={T,W,P:P.some(v=>v!=null)?P:medal('P'),S:SL.some(v=>v!=null)?SL:medal('S'),
        G:medal('G'),C:medal('C'),CL:medal('CL'),V:medal('V'),SD:medal('SD')};
      p.stod=st.nafn;
    }
  }
}

// ---------------------------------------------------------------- Gervigögn (þegar ekki næst í Open-Meteo)
function gerviGogn(gogn){
  const nu=new Date();const d0=Date.UTC(nu.getUTCFullYear(),nu.getUTCMonth(),nu.getUTCDate());
  S.timar=Array.from({length:(DAGAR+FORTID)*24},(_,k)=>new Date(d0-FORTID*864e5+k*3600e3).toISOString().slice(0,16));
  let fr=Math.floor(d0/864e5)%9973;const rnd=()=>{fr=(fr*16807)%2147483647;return fr/2147483647;};
  const blettir=Array.from({length:(DAGAR+FORTID)*2},()=>[63.6+rnd()*2.7,-23.5+rnd()*9.5,.7+rnd()*.7]);
  for(const p of ALLIR_STADIR){
    p.haed=p.skidasvaedi?Math.round(450+300*rnd()):Math.round(80+950*Math.exp(-((p.lat-64.8)**2/.3+(p.lon+18.4)**2/5))+120*rnd());
    gogn[p.id]={};
    for(const[li,likan]of['ecmwf_ifs025','icon_seamless','dmi_harmonie_arome_europe'].entries()){
      const ar=Object.fromEntries(LYKLAR.map(k=>[k,[]]));
      for(let k=0;k<S.timar.length;k++){
        const dagur=Math.floor(k/24),klst=k%24,[bl,bo,a]=blettir[Math.min(blettir.length-1,dagur*2+(klst>12?1:0))];
        const gott=a*Math.exp(-((p.lat-bl)**2/.35+(p.lon-bo)**2/2.2))+.05*li*Math.sin(p.lon+k/7);
        const dag=Math.max(0,Math.sin((klst-7)/12*Math.PI));
        const T=6-1.6*(p.lat-63.4)-p.haed/160+3.5*gott+3*dag-1.5+(rnd()-.5);
        const W=Math.max(.3,7-4.5*gott+p.haed/300+(rnd()-.5)*1.5);
        const C=Math.max(0,Math.min(100,80-75*gott+(rnd()-.5)*15));
        ar.T.push(T);ar.W.push(W);ar.G.push(W*1.6+rnd()*2);ar.P.push(Math.max(0,.6-.8*gott+(rnd()-.6)*.4));
        ar.C.push(C);ar.CL.push(C*.7);ar.S.push(dag>0?Math.max(0,3600*(1-C/100)):0);ar.V.push(30000-C*200);
        ar.SD.push(p.haed>450?(p.haed-450)/900:0);ar.SF.push(T<.5?Math.max(0,.6-.8*gott+(rnd()-.6)*.4)*1.2:0);
      }
      gogn[p.id][likan]=ar;
    }
  }
}

// ---------------------------------------------------------------- Útreikningur
const medaltal=a=>{let s=0,n=0;for(const v of a)if(v!=null){s+=v;n++;}return n?s/n:null;};
const summa=a=>{let s=0,n=0;for(const v of a)if(v!=null){s+=v;n++;}return n?s:null;};
const haest=a=>{let m=null;for(const v of a)if(v!=null&&(m==null||v>m))m=v;return m;};
const laegst=a=>{let m=null;for(const v of a)if(v!=null&&(m==null||v<m))m=v;return m;};

function idag(){const n=new Date();return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate());}
function gluggi(){
  const f=FLOKKAR[S.flokkur];if(!S.timar.length)return null;
  const t0=Date.parse(S.timar[0]+'Z'),d0=idag()+S.dagur*864e5;
  const nuKlst=Math.floor(Date.now()/36e5)*36e5;
  let a=f.haetta?d0+f.fra*36e5:Math.max(d0+f.fra*36e5,nuKlst),b=d0+f.til*36e5;
  const i0=Math.max(0,Math.round((a-t0)/36e5)),i1=Math.min(S.timar.length,Math.round((b-t0)/36e5));
  return i1>i0?{i0,i1,a,b}:null;
}
function maelikvardar(ar,i0,i1,p){
  const s=k=>(ar[k]||[]).slice(i0,i1);
  const S_=medaltal(s('S')),C=medaltal(s('C'));
  return{T:medaltal(s('T')),Tmax:haest(s('T')),Tmin:laegst(s('T')),vindur:medaltal(s('W')),hvida:haest(s('G')),
    urkoma:summa(s('P')),sky:C,lagsky:medaltal(s('CL')),sol:S_!=null?Math.min(1,S_/3600/.85):(C!=null?1-C/100:null),
    skyggni:laegst(s('V')),snjor:medaltal(s('SD')),myrkur:p.myrkur,klst:i1-i0,...saga(ar,i0,i1)};
}
// Nýsnjór síðustu 72 klst, vindur og regn á snjó síðustu 48 klst (til og með tímabilinu)
function saga(ar,i0,i1){
  const h=(k,n)=>(ar[k]||[]).slice(Math.max(0,i0-n),i1);
  const SF=h('SF',72),P72=h('P',72),T72=h('T',72),P48=h('P',48),T48=h('T',48);
  let nysnjor=null;
  if(SF.some(v=>v!=null))nysnjor=summa(SF);
  else if(P72.some(v=>v!=null)){nysnjor=0;P72.forEach((v,k)=>{if(v!=null&&T72[k]!=null&&T72[k]<.5)nysnjor+=v;});} // 1 mm úrkoma ≈ 1 cm snjór
  let regnSnjo=null;
  if(P48.some(v=>v!=null)){regnSnjo=0;P48.forEach((v,k)=>{if(v!=null&&T48[k]!=null&&T48[k]>1)regnSnjo+=v;});}
  return{nysnjor,regnSnjo,vindur48:medaltal(h('W',48))};
}
function stigFyrir(m,f,haed){
  let sw=0,su=0;for(const[w,u]of f.thaettir(m))if(u!=null){sw+=w;su+=w*u;}
  if(!sw)return null;
  let st=100*su/sw;const h=haed==null?1:f.haed(haed);st*=h==null?1:h;if(f.skilyrdi)st*=f.skilyrdi(m);
  return Math.max(0,Math.min(100,st));
}
function metaPunkt(p,lk,g,f){
  const stig=[],maelir=[];
  for(const ar of Object.values(lk)){const m=maelikvardar(ar,g.i0,g.i1,p);const st=stigFyrir(m,f,p.haed);if(st!=null){stig.push(st);maelir.push(m);}}
  if(!stig.length)return null;
  const st=stig.reduce((a,b)=>a+b)/stig.length;
  const dreifing=Math.sqrt(stig.reduce((a,b)=>a+(b-st)**2,0)/stig.length);
  const m={};for(const k of Object.keys(maelir[0]))m[k]=medaltal(maelir.map(x=>x[k]));
  return{...p,stig:+st.toFixed(1),dreifing,m,fjLikana:stig.length};
}
function reikna(){
  const f=FLOKKAR[S.flokkur],g=gluggi();
  document.getElementById('lysing').textContent=flT(S.flokkur,1);
  if(!S.gogn){return;}
  if(!g){S.nidurstada=[];S.allir=[];teikna(t('tomtLidid'));return;}
  const sv=S.svaedi;
  if(sv?.saekir){S.nidurstada=[];S.allir=[];teikna(t('sv_saeki'));return;}
  if(sv?.tomt){S.nidurstada=[];S.allir=[];teikna(t('sv_ekkert'));return;}
  const allir=[];
  const frambod=f.stadir?SKIDASVAEDI.filter(x=>!sv||sv.b.contains([x.lat,x.lon])):(sv?sv.pts:PUNKTAR),uppspretta=sv&&!f.stadir?sv.gogn:S.gogn;
  for(const p of frambod){const lk=uppspretta?.[p.id];if(!lk)continue;const a=metaPunkt(p,lk,g,f);if(a)allir.push(a);}
  if(!f.ofugt&&!f.haetta){const vg=vidvVirkar(g.a,g.b);
    if(vg.length)for(const a of allir){const v=verstaVidv(a,vg);if(v){a.vidv=v.litur;a.stig=+(a.stig*VID_STUDULL[v.litur]).toFixed(1);}}}
  S.allir=allir;
  // Val með stöðugleika: fyrri punktur heldur sér ef hann er enn nógu góður
  const rodun=[...allir].sort((a,b)=>b.stig-a.stig),n=f.stadir?SKIDASVAEDI.length:S.fjoldi,
    minKm=f.stadir?0:sv?Math.min(30,Math.max(1.5,km({lat:sv.b.getSouth(),lon:sv.b.getWest()},{lat:sv.b.getNorth(),lon:sv.b.getEast()})/(S.fjoldi*1.3))):S.fjoldi>=20?22:30,
    lagmark=f.stadir?0:(f.haetta||f.ofugt)?25:sv?0:20;
  const lykill=`bs:val:${S.flokkur}:${new Date(g.a).toISOString().slice(0,10)}${sv?':sv':''}`,fyrri=geyma.get(lykill)||[];
  const threskuldur=rodun.length?rodun[Math.min(n,rodun.length)-1].stig-4:0;
  const eftirId=Object.fromEntries(allir.map(a=>[a.id,a])),valdir=[];
  for(const id of fyrri){if(valdir.length>=n)break;const a=eftirId[id];if(a&&a.stig>=threskuldur&&a.stig>=lagmark&&valdir.every(v=>km(a,v)>=minKm))valdir.push(a);}
  for(const a of rodun){if(valdir.length>=n)break;if(a.stig<lagmark)break;if(!valdir.includes(a)&&valdir.every(v=>km(a,v)>=minKm))valdir.push(a);}
  valdir.forEach(a=>a.stada=fyrri.includes(a.id)?'óbreytt':'nýr');
  valdir.sort((a,b)=>b.stig-a.stig);
  geyma.set(lykill,valdir.map(a=>a.id));
  S.nidurstada=valdir;S.virkur=-1;
  teikna(valdir.length?null:t(f.stadir&&sv?'sv_ekkiSkidi':f.haetta?'tomtHaetta':f.ofugt?'tomtVerst':f.stadir?'tomtSkidi':'tomt'));
}

async function finnaNakvaemt(i,takki){
  const a=S.nidurstada[i],f=FLOKKAR[S.flokkur],g=gluggi();if(!g)return;
  takki.disabled=true;takki.textContent=t('reiknaN');
  const smar=[];
  for(let r=-3;r<=3;r++)for(let c=-3;c<=3;c++){
    const la=+(a.lat+r*.125/3.5).toFixed(4),lo=+(a.lon+c*.25/3.5).toFixed(4);
    if(STROND.some(h=>innanHrings(la,lo,h)))smar.push({id:`${la},${lo}`,lat:la,lon:lo,myrkur:a.myrkur,haed:null});
  }
  const gogn={};
  try{
    if(S.demo)gerviNakvaemt(a,smar,gogn);
    else{
      const likon=[...S.likon].filter(id=>S.heimildir.includes(LIKON.find(l=>l.id===id).nafn));
      const nidur=await Promise.allSettled(likon.map(id=>saekjaLikan(id,smar).then(svor=>umbreyta(svor,id,gogn,smar))));
      if(!nidur.some(n=>n.status==='fulfilled'))throw new Error(nidur[0]?.reason?.message||'engin svör');
    }
  }catch(e){takki.disabled=false;takki.textContent=t('mistokst',{e:e.message});return;}
  const nidurstodur=smar.filter(p=>gogn[p.id]&&!(p.haed!=null&&p.haed<=0)).map(p=>metaPunkt(p,gogn[p.id],g,f)).filter(Boolean)
    .sort((x,y)=>y.stig-x.stig);
  nakvLag.clearLayers();
  if(!nidurstodur.length){takki.textContent=t('engin');return;}
  const valdir=[];for(const p of nidurstodur){if(valdir.length>=3)break;if(valdir.every(v=>km(p,v)>=5))valdir.push(p);}
  valdir.forEach((p,j)=>{
    p.nafn=naestiBaer(p);
    const d=document.createElement('div');
    const w=vedurtakn(p.m,erNott());
    d.innerHTML=`<strong>${j===0?t('besti',{i:i+1}):t('nbesti',{j:j+1,i:i+1})}</strong><p class="vt-lina"><span class="vt-stort" aria-hidden="true">${w.takn}</span>${w.ord}</p><p class="gildi-lina">${gildistexti(p)}</p>
      <p>${t('stig',{x:fm(p.stig)})} ${ovissa(p)}.</p>
      <p class="smatt">${p.nafn}<br>${hnitTexti(p)}${p.haed!=null?', '+t('haed',{h:Math.round(p.haed)}):''}</p>${tenglar(p)}`;
    tengjaAfrita(d);
    const m=L.marker([p.lat,p.lon],{icon:merkiTakn(j===0?'★':`${i+1}${'abc'[j]}`,'litill'),title:t(j===0?'besti':'nbesti',{i:i+1,j:j+1}),zIndexOffset:500})
      .bindPopup(d,{maxWidth:popW()}).addTo(nakvLag);
    if(j===0)setTimeout(()=>m.openPopup(),850);
  });
  kort.flyTo([valdir[0].lat,valdir[0].lon],12,{duration:.8});
  takki.disabled=false;takki.textContent=t('reiknaAftur');
}
function gerviNakvaemt(a,smar,gogn){
  const foreldri=S.gogn[a.id];
  for(const p of smar){
    const dx=(p.lat-a.lat)*40,dy=(p.lon-a.lon)*20,landslag=Math.sin(dx*1.7+dy)*Math.cos(dy*1.3-dx*.6);
    p.haed=Math.max(5,Math.round((a.haed||200)+220*landslag));
    gogn[p.id]={};
    for(const[likan,ar]of Object.entries(foreldri)){
      const n={};for(const k of LYKLAR)n[k]=ar[k]?ar[k].slice():null;
      n.T=n.T&&n.T.map(v=>v==null?null:v-(p.haed-(a.haed||200))/160);
      n.W=n.W&&n.W.map(v=>v==null?null:Math.max(.2,v*(1+.25*landslag)));
      n.G=n.G&&n.G.map(v=>v==null?null:Math.max(.5,v*(1+.25*landslag)));
      gogn[p.id][likan]=n;
    }
  }
}

  ullarsokkar:'🧦',tvennirsokkar:'🧦',aukasokkar:'🧦',strigaskor:'👟',gonguskor:'🥾',vetrarskor:'🥾',leggh:'🥾',broddar:'🧊',ishofi:'⛏️',
  sundfot:'🩱',inniskor:'🩴',solgleraugu:'🕶️',solarvorn:'🧴',hofudljos:'🔦',aukalag:'🎒',svefnpoki:'🛌',tjald:'⛺',appelsinugult:'🦺',
  simi:'📱',endurskin:'🔆',handhitarar:'🔥',hitabrusi:'☕',snjoflodabun:'📡',vatn:'🥪'};
const KL_ROD=Object.keys(KL_EMOJI);
const kt=(k,v={})=>(L_().k?.[k]??I18N.is.k[k]??k).replace(/\{(\w+)\}/g,(_,n)=>v[n]??'');
const kn=(k,v={})=>(L_().n?.[k]??I18N.is.n[k]??k).replace(/\{(\w+)\}/g,(_,n)=>v[n]??'');
function vindkaeling(T,W){if(T==null||W==null)return T;const v=W*3.6;if(T>10||v<4.8)return T;return 13.12+.6215*T-11.37*v**.16+.3965*T*v**.16;}
function myrkurFyrir(p){const dR=km(p,{lat:64.13,lon:-21.9}),dA=km(p,{lat:65.68,lon:-18.09});return 1-Math.max(laegra(dR,25,70),.6*laegra(dA,8,30));}

function klaednadur(fk,m,p,g){
  const T=m.T??5,W=m.vindur??3,G=m.hvida??W*1.5,P=m.urkoma??0,SD=m.snjor??0,sol=m.sol??0;
  const F=vindkaeling(T,W),man=new Date(g.a).getUTCMonth(),klst=Math.max(1,(g.b-g.a)/36e5);
  const virk={fjall:4,hjol:5,skidi:6,alpaskidi:3,rjupa:3}[fk]??0,kyrr={nordurljos:-4,utilega:-1,verst:-2}[fk]??0;
  const Te=F+virk+kyrr,fot=new Set(),med=[],vita=[];
  const blautt=P>=1||P/klst>=.3,mjogBlautt=P>=4,hvasst=W>=8||G>=15,snjor=SD>=.05,dimmt=man>=9||man<=1;
  // Efri hluti eftir upplifuðum hita, leiðréttum fyrir hreyfingu
  if(Te>=18)fot.add('stutterma');
  else if(Te>=12)fot.add('langerma');
  else if(Te>=6){fot.add('langerma');fot.add('flis');}
  else if(Te>=0)['ullarbolur','flis','ulpa','husa','vettlingar'].forEach(k=>fot.add(k));
  else if(Te>=-6)['ullarbolur','ullarbuxur','thykkpeysa','ulpa','thykkhufa','vettlingar','halsklutur'].forEach(k=>fot.add(k));
  else ['ullarbolur','ullarbuxur','thykkpeysa','dunulpa','thykkhufa','luffur','halsklutur','andlit'].forEach(k=>fot.add(k));
  // Ytra lag
  if(blautt){if(Te>0)fot.delete('ulpa');fot.add('skel');if(mjogBlautt||(Te<=0&&P>=2))fot.add('regnbuxur');}
  else if(hvasst&&!fot.has('ulpa')&&!fot.has('dunulpa'))fot.add('vindjakki');
  else if(Te>=6&&Te<12)fot.add('lettjakki');
  // Buxur, skór og sokkar
  if(['fjall','rjupa','utilega'].includes(fk))fot.add('gongubuxur');
  else if(fk==='alpaskidi')fot.add('skidabuxur');
  else if(Te>=18&&!blautt)fot.add('stuttbuxur');
  else fot.add('buxur');
  if(fk==='alpaskidi')fot.delete('regnbuxur');
  if(['fjall','rjupa','utilega'].includes(fk))fot.add('gonguskor');
  else if(fk==='hjol')fot.add('strigaskor');
  else if(!['skidi','alpaskidi','sund'].includes(fk))fot.add(Te<2||snjor?'vetrarskor':'strigaskor');
  if(Te<-6)fot.add('tvennirsokkar');else if(Te<6)fot.add('ullarsokkar');
  if(snjor&&['fjall','rjupa'].includes(fk))fot.add('leggh');
  // Hálka
  const halka=(m.Tmin??T)<=2&&(m.Tmax??T)>=-3&&(P>=.5||snjor);
  if(halka&&!['skidi','alpaskidi','sund'].includes(fk)){med.push(fk==='fjall'&&snjor&&(p.haed??0)>300?'ishofi':'broddar');vita.push(kn('halka'));}
  // Sól
  if(sol>=.5||(snjor&&sol>=.3)){
    med.push(['skidi','alpaskidi'].includes(fk)&&(snjor||Te<0)?'skidagleraugu':'solgleraugu');
    if(man>=3&&man<=8)med.push('solarvorn');
    if(Te>=15&&sol>=.6)fot.add('derhufa');
  }
  // Myrkur
  if(['fjall','rjupa','utilega','nordurljos','skidi'].includes(fk)&&(dimmt||fk==='nordurljos'))med.push('hofudljos');
  // Sértækt fyrir hvern flokk
  switch(fk){
    case 'utilega':{const Tn=vindkaeling(m.Tmin??T,W);med.push(['svefnpoki',Math.round(Math.min(Tn,10)-5)]);
      if(hvasst||G>=12)med.push('tjald');med.push('aukasokkar');if((m.Tmin??T)<6){med.push('hitabrusi');fot.delete('husa');fot.add('thykkhufa');}break;}
    case 'rjupa':med.push('appelsinugult','simi','aukalag','vatn');break;
    case 'fjall':{med.push('aukalag','vatn','simi');const h=Math.round(((p.haed??100)+700)/100)*100;
      vita.push(kn('fjallhiti',{h,T:fm(T-4.5,0)}));break;}
    case 'nordurljos':med.push('handhitarar','hitabrusi');if(Te<5){fot.delete('ulpa');fot.add('dunulpa');}break;
    case 'hjol':fot.add('hjalmur');if(T<12)fot.add('hjolahanskar');if(dimmt)med.push('endurskin');fot.delete('ulpa');if(!fot.has('skel'))fot.add('vindjakki');break;
    case 'skidi':fot.delete('ulpa');fot.delete('dunulpa');fot.delete('skel');fot.add('vindjakki');fot.add('ullarbolur');med.push('vatn','aukalag');break;
    case 'alpaskidi':fot.add('hjalmur');fot.add('skidagleraugu');if(Te<0){fot.delete('vettlingar');fot.add('luffur');}break;
    case 'sund':fot.clear();fot.add('sundfot');fot.add('inniskor');if(T<3)fot.add('thykkhufa');vita.push(kn('sund'));break;
    case 'snjoflod':med.push('snjoflodabun');break;
    case 'verst':med.unshift('heima');break;
  }
  if(fot.has('dunulpa'))fot.delete('ulpa');
  if(fot.has('thykkhufa'))fot.delete('husa');
  if(T-F>=3)vita.unshift(kn('vindkaeling',{T:fm(T,0),F:fm(F,0)}));
  if(virk>0&&Te<10)vita.push(kn('hreyfing'));
  if(virk>0&&Te<8)vita.push(kn('bomull'));
  if(fk==='nordurljos')vita.push(kn('kyrr'));
  if(dimmt&&['fjall','rjupa','skidi','hjol'].includes(fk))vita.push(kn('myrkur'));
  const rada=a=>[...a].sort((x,y)=>KL_ROD.indexOf(Array.isArray(x)?x[0]:x)-KL_ROD.indexOf(Array.isArray(y)?y[0]:y));
  const einst=[];const sedd=new Set();for(const x of med){const k=Array.isArray(x)?x[0]:x;if(!sedd.has(k)&&!fot.has(k)){sedd.add(k);einst.push(x);}}
  return{fot:rada(fot),med:rada(einst),vita,F};
}

const KL={opin:false,stadur:null,p:null,gogn:null,velja:false,saekir:false,merki:null,skilabod:null};
const KL_STADIR=(()=>{const m=new Map();for(const[d,la,lo]of BAEIR)m.set(NEFNIFALL[d]||d,[la,lo]);for(const s of SKIDASVAEDI)m.set(s.nafn,[s.lat,s.lon]);return m;})();

function naestaReit(lat,lon){let b=null,d=1e9;for(const p of PUNKTAR){if(!S.gogn?.[p.id])continue;const x=km(p,{lat,lon});if(x<d){d=x;b=p;}}return b;}
async function klSaekja(){
  if(!KL.stadur)return;
  const p={id:'kl',lat:KL.stadur.lat,lon:KL.stadur.lon,haed:null};p.myrkur=myrkurFyrir(p);

  if(S.demo||!S.gogn){varaleid();return;}

function vidIsland(lat,lon){
  if(lat<63.1||lat>66.7||lon<-24.8||lon>-13.2)return false;
  if(STROND.some(h=>innanHrings(lat,lon,h)))return true;
  const p={lat,lon};return STROND.some(h=>h.some(([lo,la])=>km(p,{lat:la,lon:lo})<15));
}
async function klSetja(lat,lon,nafn,thekkt=false){

  KL.merki=L.circleMarker([lat,lon],{pane:'minn',radius:9,className:'minn-stadur'}).bindTooltip(t('kl_thinn')).addTo(kort);
  await klSaekja();klTeikna();
}

  const nafn=KL.stadur.nafn||naestiBaer(KL.stadur),atridi=x=>{const k=Array.isArray(x)?x[0]:x;return`<li><span aria-hidden="true">${KL_EMOJI[k]||'•'}</span><span>${kt(k,{x:Array.isArray(x)?x[1]:''})}</span></li>`;};
  box.innerHTML=`<h3>${t('kl_fyrir',{f:`${f.takn} ${flT(S.flokkur,0)}`,b:nafn})}</h3>

    ${a.stig>=1?`<p class="kl-smatt">${t(f.haetta?'haettuvisir':f.ofugt?'ovedursvisir':'stig',{x:fm(a.stig)})}</p>`:''}

function gerviSvaedi(pts,gogn){
  for(const p of pts){
    const r=naestaReit(p.lat,p.lon);if(!r)continue;
    const dx=(p.lat-r.lat)*40,dy=(p.lon-r.lon)*20,ls=Math.sin(dx*1.7+dy)*Math.cos(dy*1.3-dx*.6);
    p.haed=Math.max(5,Math.round((r.haed||200)+200*ls));gogn[p.id]={};
    for(const[lk,ar]of Object.entries(S.gogn[r.id])){
      const n={};for(const k of LYKLAR)n[k]=ar[k]?ar[k].slice():null;
      n.T=n.T&&n.T.map(v=>v==null?null:v-(p.haed-(r.haed||200))/160);
      n.W=n.W&&n.W.map(v=>v==null?null:Math.max(.2,v*(1+.25*ls)));
      n.G=n.G&&n.G.map(v=>v==null?null:Math.max(.5,v*(1+.25*ls)));
      gogn[p.id][lk]=n;
    }
  }
}
async function veljaSvaedi(b){
  const s=b.getSouth(),n=b.getNorth(),w=b.getWest(),e=b.getEast();
  const sp=Math.max(.035,Math.sqrt((n-s)*(e-w)*.423/100)),dlat=sp,dlon=sp/.423,pts=[];
  for(let la=s+dlat/2;la<n;la+=dlat)for(let lo=w+dlon/2;lo<e;lo+=dlon){
    const p={id:`s:${la.toFixed(3)},${lo.toFixed(3)}`,lat:+la.toFixed(4),lon:+lo.toFixed(4),hl:dlat/2,hn:dlon/2,haed:null};
    if(STROND.some(h=>innanHrings(p.lat,p.lon,h))){p.myrkur=myrkurFyrir(p);p.nafn=naestiBaer(p);pts.push(p);}
  }
  if(SV.rammi)kort.removeLayer(SV.rammi);
  SV.rammi=L.rectangle(b,{className:'svaedisrammi',interactive:false}).addTo(kort);
  document.getElementById('sv-hreinsa').hidden=false;
  kort.flyToBounds(b,{padding:[20,20],duration:.7});
  if(!pts.length&&!SKIDASVAEDI.some(x=>b.contains([x.lat,x.lon]))){S.svaedi={b,pts:[],gogn:{},saekir:false,tomt:true};reikna();return;}
  S.svaedi={b,pts,gogn:null,saekir:true};reikna();
  const gogn={};
  if(S.demo||!S.heimildir.some(h=>LIKON.some(l=>l.nafn===h)))gerviSvaedi(pts,gogn);
  else{
    const likon=[...S.likon].filter(id=>S.heimildir.includes(LIKON.find(l=>l.id===id).nafn));
    await Promise.allSettled(likon.map(id=>saekjaLikan(id,pts).then(sv=>umbreyta(sv,id,gogn,pts))));
    if(!Object.keys(gogn).length)gerviSvaedi(pts,gogn);
  }
  for(const p of pts)if(p.haed!=null&&p.haed<=0)delete gogn[p.id];
  if(S.svaedi?.b!==b)return; // nýtt svæði valið á meðan
  S.svaedi={b,pts,gogn,saekir:false};reikna();
}
function hreinsaSvaedi(){
  S.svaedi=null;if(SV.rammi){kort.removeLayer(SV.rammi);SV.rammi=null;}
  document.getElementById('sv-hreinsa').hidden=true;
  kort.flyToBounds([[63.3,-24.6],[66.6,-13.4]],{duration:.7});reikna();

function teiknaSvaediKassa(){
  const box=document.getElementById('sv-kassi');
  if(!S.svaedi){box.hidden=true;return;}
  box.hidden=false;const best=S.nidurstada[0];
  box.innerHTML=`<strong>${t('sv_titill')}</strong><button type="button" class="sv-allt">${t('sv_hreinsa')}</button>${best?`<button type="button" class="sv-kl">${t('sv_klaedi')}</button>`:''}`;
  box.querySelector('.sv-allt').onclick=()=>hreinsaSvaedi();
  box.querySelector('.sv-kl')?.addEventListener('click',()=>{klOpna(true);klSetja(best.lat,best.lon,null,true);document.querySelector('.klaedi').scrollIntoView({block:'start',behavior:'smooth'});});
}

// ---------------------------------------------------------------- Topp 5 / 10 / 20
function teiknaTop(){
  document.querySelectorAll('.topval button').forEach(b=>{const n=+b.dataset.n;b.textContent=t('topN',{n});
    b.setAttribute('aria-pressed',n===S.fjoldi);b.onclick=()=>{S.fjoldi=n;vista();teiknaTop();reikna();};});
}

// ---------------------------------------------------------------- Stýringar
function teiknaFlokka(){
  const r=document.getElementById('flokkar');r.replaceChildren();
  for(const[k,f]of Object.entries(FLOKKAR)){
    const b=document.createElement('button');b.type='button';b.className='flokkur';b.textContent=`${f.takn} ${flT(k,0)}`;
    b.setAttribute('aria-pressed',k===S.flokkur);b.onclick=()=>{S.flokkur=k;vista();document.title=t('titill')===flT(k,0)?t('titill'):`${t('titill')} – ${flT(k,0)}`;teiknaFlokka();velDagSjalfkrafa();teiknaDaga();reikna();};
    r.appendChild(b);
  }
}
function velDagSjalfkrafa(){ if(S.dagur===0&&S.timar.length&&!gluggi())S.dagur=1; }
function teiknaDaga(){
  const r=document.getElementById('dagar');r.replaceChildren();if(!S.timar.length)return;
  velDagSjalfkrafa();
  const d0=idag();
  for(let i=0;i<DAGAR;i++){
    const d=new Date(d0+i*864e5),b=document.createElement('button');b.type='button';b.className='dagur';
    b.textContent=i===0?t('idag'):i===1?t('amorgun'):dagsTexti(d);
    b.setAttribute('aria-pressed',i===S.dagur);b.onclick=()=>{S.dagur=i;teiknaDaga();reikna();};r.appendChild(b);
  }
}
function teiknaStillingar(){
  const lv=document.getElementById('likon-val');lv.replaceChildren();
  for(const l of LIKON){
    const lab=document.createElement('label');lab.className='likan';
    const c=document.createElement('input');c.type='checkbox';c.checked=S.likon.has(l.id);
    c.onchange=()=>{c.checked?S.likon.add(l.id):S.likon.delete(l.id);if(!S.likon.size){S.likon.add(l.id);c.checked=true;}vista();};
    lab.append(c,` ${l.nafn} `);const sm=document.createElement('small');sm.textContent=L_().likon?.[l.id]||l.lysing;lab.append(sm);lv.appendChild(lab);
  }
}
document.getElementById('saekja').onclick=saekjaAllt;

// ---------------------------------------------------------------- Tungumál
function thydaFast(){
  document.documentElement.lang=LANG==='zh'?'zh-CN':LANG;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.i18nAria)));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  if(typeof teiknaTop==='function')teiknaTop();
  const svb=document.getElementById('sv-velja');if(svb)svb.textContent=t(SV.velja?'sv_haetta':'sv_hnappur');
  document.title=t('titill')===flT(S.flokkur,0)?t('titill'):`${t('titill')} – ${flT(S.flokkur,0)}`;
  const g=document.getElementById('gestir');if(g.dataset.n)g.textContent=t('gestir',{n:g.dataset.n});
}
const malVal=document.getElementById('mal');
for(const[k,v]of Object.entries(I18N)){const o=document.createElement('option');o.value=k;o.textContent=v.nafn;malVal.appendChild(o);}
malVal.value=LANG;
malVal.onchange=()=>{
  LANG=malVal.value;geyma.set('bs:mal',LANG);
  PUNKTAR.forEach(p=>p.nafn=naestiBaer(p));S.svaedi?.pts?.forEach(p=>p.nafn=naestiBaer(p));
  thydaFast();teiknaFlokka();teiknaDaga();teiknaStillingar();reikna();if(S.gogn&&!S.nidurstada.length&&!gluggi())teikna(t('tomtLidid'));leid();
};

// ---------------------------------------------------------------- Síður (Um síðuna, Hvernig virkar þetta)
function leid(){
  const h=location.hash.replace('#',''),sida=(h==='um'||h==='hvernig')?h:'';
  document.body.classList.toggle('a-sidu',!!sida);
  const el=document.getElementById('sida');el.hidden=!sida;
  document.querySelectorAll('.valmynd a').forEach(a=>a.dataset.sida===sida?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  if(sida){document.getElementById('sida-efni').innerHTML=(L_().sidur||I18N.is.sidur)[sida];el.scrollTop=0;window.scrollTo(0,0);el.focus({preventScroll:true});}
  else setTimeout(()=>kort.invalidateSize(),30);
}
addEventListener('hashchange',leid);

// ---------------------------------------------------------------- Gestateljari
// Í claude.ai: innbyggð „room“-tenging. Á eigin vefsvæði: Firebase Realtime Database (sjá LESTU_MIG.md).
const TELJARI={firebase:null /* t.d. {apiKey:"…",authDomain:"…",databaseURL:"https://….firebaseio.com",projectId:"…"} */};
function synaGesti(n){const e=document.getElementById('gestir');if(!n){e.hidden=true;delete e.dataset.n;return;}e.hidden=false;e.dataset.n=n;e.textContent=t('gestir',{n});}
const hladaSkrift=src=>new Promise((ok,villa)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=villa;document.head.appendChild(s);});
(async()=>{
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const room=await window.claude.use('room');
      if(room){room.onPeers(ch=>synaGesti(ch.peers.filter(p=>p.kind==='viewer').length));return;}
    }
  }catch{}
  if(!TELJARI.firebase)return;
  try{
    await hladaSkrift('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await hladaSkrift('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
    firebase.initializeApp(TELJARI.firebase);
    const db=firebase.database(),eg=db.ref('gestir').push();
    db.ref('.info/connected').on('value',s=>{if(s.val()){eg.onDisconnect().remove();eg.set(firebase.database.ServerValue.TIMESTAMP);}});
    db.ref('gestir').on('value',s=>synaGesti(s.numChildren()));
  }catch(e){console.warn('Gestateljari virkar ekki:',e);}
})();

thydaFast();teiknaFlokka();teiknaStillingar();reikna();leid();saekjaAllt();
setInterval(()=>{if(!document.hidden)saekjaAllt();},60*60e3);
</script>
